name: Deploy

on:
  push:
    branches: [demo]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: vars.TRIGGER_PROJECT_REF != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SHA: ${{ github.sha }}
      TRIGGER_PROJECT_REF: ${{ vars.TRIGGER_PROJECT_REF }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Push the schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm db:push --force 2>&1 | tee push.log
          grep -qE "Changes applied|No changes detected" push.log

      - name: Deploy the worker
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: pnpm exec trigger deploy --env prod --external-id "$SHA"

      - name: Deploy the app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pnpm dlx vercel@64.5.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          sed -i '/^[A-Z0-9_]*=""$/d' .vercel/.env.production.local
          DATABASE_URL=postgres://build@localhost/build \
          BETTER_AUTH_SECRET=build-only-placeholder-never-used-at-runtime \
          ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
          TRIGGER_SECRET_KEY=build \
          DAYTONA_API_KEY=build \
            pnpm dlx vercel@64.5.0 build --prod --token="$VERCEL_TOKEN"
          pnpm dlx vercel@64.5.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN" \
            --env TRIGGER_EXTERNAL_DEPLOYMENT_ID="$SHA"
